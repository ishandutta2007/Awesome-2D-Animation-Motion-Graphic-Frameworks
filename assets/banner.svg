<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="50%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#161233"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#BA38FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Bloom/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .main-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }
    @keyframes waveMotion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
      50% { transform: translateY(-18px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
    }

    .pulsing-orb1 { animation: pulseGlow 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulsing-orb2 { animation: pulseGlow 9s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .wave-line { stroke-dasharray: 12, 10; animation: waveMotion 5s linear infinite; }
    .wave-line-fast { stroke-dasharray: 8, 8; animation: waveMotion 3s linear infinite; }
    .orbiting-circle { animation: orbitNode 8s linear infinite; transform-origin: 1040px 140px; }
    .p-float1 { animation: floatParticle 4s ease-in-out infinite; }
    .p-float2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
    .p-float3 { animation: floatParticle 5s ease-in-out infinite 0.7s; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Cybernetic Grid Pattern in Background -->
  <g opacity="0.08" stroke="#00D2FF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="850" y1="0" x2="850" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1150" y1="0" x2="1150" y2="420"/>
  </g>

  <!-- Ambient Glowing Orbs (Dynamic Background) -->
  <circle cx="180" cy="110" r="140" fill="url(#glowGrad1)" filter="url(#softGlow)" class="pulsing-orb1"/>
  <circle cx="1020" cy="280" r="180" fill="url(#glowGrad2)" filter="url(#softGlow)" class="pulsing-orb2"/>
  <circle cx="850" cy="90" r="110" fill="url(#primaryGrad)" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Dynamic Motion Curve Graphs (Lower Background) -->
  <path d="M 0 350 C 300 390, 450 280, 700 330 C 900 370, 1050 290, 1200 340" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.3" class="wave-line"/>
  <path d="M 0 380 C 250 330, 500 410, 800 350 C 1000 310, 1100 390, 1200 360" fill="none" stroke="#00D2FF" stroke-width="1.5" opacity="0.2" class="wave-line-fast"/>

  <!-- Right Visual Feature: Animated 2D Rigging Skeleton & Motion Nodes -->
  <g transform="translate(870, 70)">
    <!-- Tech boundary backdrop -->
    <rect x="0" y="0" width="270" height="230" rx="14" fill="#080a14" fill-opacity="0.6" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Mini header -->
    <rect x="0" y="0" width="270" height="32" rx="14" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="20" cy="16" r="4.5" fill="#FF5F56"/>
    <circle cx="36" cy="16" r="4.5" fill="#FFBD2E"/>
    <circle cx="52" cy="16" r="4.5" fill="#27C93F"/>
    <text x="75" y="20" fill="#6B7280" font-size="11" font-weight="600" class="code-text">RIG_GRAPH::2D</text>

    <!-- Skeletal Rigging Nodes & Connecting Bones -->
    <!-- Bone vectors -->
    <line x1="80" y1="80" x2="140" y2="120" stroke="#BA38FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="140" y1="120" x2="200" y2="85" stroke="#BA38FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="140" y1="120" x2="140" y2="190" stroke="#00D2FF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="140" y1="190" x2="70" y2="210" stroke="#FF3366" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <line x1="140" y1="190" x2="215" y2="205" stroke="#FF3366" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Joint Nodes -->
    <circle cx="80" cy="80" r="7" fill="#161233" stroke="#BA38FF" stroke-width="2.5" class="p-float1"/>
    <circle cx="200" cy="85" r="7" fill="#161233" stroke="#BA38FF" stroke-width="2.5" class="p-float2"/>
    <circle cx="140" cy="120" r="9" fill="#BA38FF" filter="url(#glow)"/>
    <circle cx="140" cy="190" r="8" fill="#00D2FF" filter="url(#glow)"/>
    <circle cx="70" cy="210" r="6" fill="#161233" stroke="#FF3366" stroke-width="2.5"/>
    <circle cx="215" cy="205" r="6" fill="#161233" stroke="#FF3366" stroke-width="2.5"/>

    <!-- Orbiting IK Controller -->
    <circle cx="170" cy="140" r="5" fill="#00FFB2" filter="url(#glow)" class="orbiting-circle"/>
  </g>

  <!-- Left Content Foreground (Remains 100% Crisp & Legible) -->
  <g transform="translate(70, 75)">
    <!-- Category Badge Pill -->
    <rect x="0" y="0" width="270" height="32" rx="16" fill="url(#badgeGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#00D2FF" filter="url(#glow)"/>
    <text x="30" y="21" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1.5" class="code-text">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#FFFFFF" font-size="44" font-weight="900" letter-spacing="-0.5" class="main-text">
      Awesome 2D Animation &amp;
    </text>
    <text x="0" y="135" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" class="main-text" filter="url(#glow)">
      Motion Graphic Frameworks
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="175" fill="#94A3B8" font-size="16" font-weight="400" class="main-text">
      The definitive index of SaaS suites, skeletal engines, vector runtimes &amp; creative code.
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 210)">
      <!-- Pill 1: Skeletal Rigging -->
      <g>
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="rgba(255, 51, 102, 0.4)" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#FF3366"/>
        <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="600" class="main-text">🦴 Skeletal Rigging</text>
      </g>
      <!-- Pill 2: Vector & Tweening -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="168" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="rgba(186, 56, 255, 0.4)" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#BA38FF"/>
        <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="600" class="main-text">⚡ Vector Tweening</text>
      </g>
      <!-- Pill 3: Code & Runtimes -->
      <g transform="translate(352, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#00D2FF"/>
        <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="600" class="main-text">💻 Code &amp; Web Runtimes</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(534, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#10B981"/>
        <text x="28" y="22" fill="#F1F5F9" font-size="12" font-weight="600" class="main-text">🌟 100% Open Source</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
</svg>
